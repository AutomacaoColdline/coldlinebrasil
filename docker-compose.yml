services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coldline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Coldline123}
      POSTGRES_DB: ${POSTGRES_DB:-coldlinedb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coldline} -d $${POSTGRES_DB:-coldlinedb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-coldline}:${POSTGRES_PASSWORD:-Coldline123}@postgres:5432/${POSTGRES_DB:-coldlinedb}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-0ae1c7c01a714cd9b45134ac180ead05b3036572b97a4878a6ea571006c2e929}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-A6sT9vX!zK@jLqP$1mYdN7#pWx*C2Q4b}
      PORT: 4000
      # SMTP para recuperação de senha - defina no seu .env local, nunca aqui
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
  pgdata:
