version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldlinebrasil-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coldlinebrasil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coldlinebrasil-net

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coldlinebrasil-server
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/coldlinebrasil?sslmode=disable
      PORT: 8080
      ENV: development
      JWT_SECRET: sua_chave_super_secreta_aqui_mude_em_producao
      JWT_EXPIRATION: 24h
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coldlinebrasil-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  coldlinebrasil-net:
    driver: bridge
